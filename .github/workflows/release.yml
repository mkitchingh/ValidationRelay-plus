name: Release

# When you publish a release on GitHub, this builds the .tipa and attaches
# it to that release, so people can download it directly.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build ValidationRelay.tipa
        run: ./build.sh

      - name: Attach the .tipa to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ValidationRelay.tipa --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ValidationRelay
          path: ValidationRelay.tipa
          if-no-files-found: error
