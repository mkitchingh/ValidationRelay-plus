name: Build

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push cancels an older run still building on the same branch, so
# queued macOS jobs don't pile up.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build ValidationRelay.tipa
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ValidationRelay
          path: ValidationRelay.tipa
          if-no-files-found: error
