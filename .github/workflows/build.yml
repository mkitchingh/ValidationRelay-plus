name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build ValidationRelay.tipa
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ValidationRelay
          path: ValidationRelay.tipa
          if-no-files-found: error
